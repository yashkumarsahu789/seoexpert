name: Update docs for GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: https://us-central1-manager-fc26f.cloudfunctions.net/api

      - run: |
          rm -rf docs
          mkdir docs
          cp -r dist/* docs/
          cp dist/index.html docs/404.html

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update GitHub Pages build in docs/'
          file_pattern: 'docs/**'
