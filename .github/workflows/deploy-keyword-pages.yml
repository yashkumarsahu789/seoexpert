name: Deploy Keyword Pages

on:
  push:
    branches: [main, master]
    paths:
      - 'webflow/coupon-sites/**'
      - 'tools/public/pages/**'
      - 'tools/public/out/**'
      - '.github/workflows/deploy-keyword-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: keyword-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp -r tools/public/* _site/
          mkdir -p _site/coupon-sites
          cp webflow/coupon-sites/*.html _site/coupon-sites/
          cp webflow/coupon-sites/index.json _site/coupon-sites/
          cp webflow/coupon-sites/*.json _site/coupon-sites/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
