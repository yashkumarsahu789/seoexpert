name: Daily Keyword Page

on:
  schedule:
    # 8:00 AM IST (02:30 UTC)
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Skip 24h daily limit'
        type: boolean
        default: false
      keyword:
        description: 'Specific keyword (optional)'
        type: string
        default: ''
      no_ai:
        description: 'Template only (no Groq)'
        type: boolean
        default: false
      dry_run:
        description: 'Preview only — no Firebase save'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-keyword-page
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: Install tools dependencies
        working-directory: tools
        run: npm ci

      - name: Run daily keyword page automation
        env:
          grok: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          SERPer_API_KEY: ${{ secrets.SERPER_API_KEY }}
          sambanova.ai: ${{ secrets.SAMBANOVA_API_KEY }}
          huggingface: ${{ secrets.HUGGINGFACE_TOKEN }}
          SERP_API_KEY: ${{ secrets.SERP_API_KEY }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          KEYWORD_PAGES_USE_AI: 'true'
          KEYWORD_PAGES_DAILY_MAX: '1'
          VITE_KEYWORD_PAGES_PUBLIC_BASE: https://shop.LifeSolveNow.com/pages
          VITE_TOOLS_PUBLIC_URL: https://shop.LifeSolveNow.com
        run: |
          ARGS=""
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          [ "${{ inputs.force }}" = "true" ] && ARGS="$ARGS --force"
          [ "${{ inputs.no_ai }}" = "true" ] && ARGS="$ARGS --no-ai"
          [ -n "${{ inputs.keyword }}" ] && ARGS="$ARGS --keyword=${{ inputs.keyword }}"
          node scripts/daily-keyword-page.mjs $ARGS

      - name: Commit registry + sitemap
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tools/public/pages/index.json tools/public/pages/sitemap.xml tools/public/pages/robots.txt
          if git diff --staged --quiet; then
            echo "No registry changes"
          else
            git commit -m "keyword-pages: daily registry + sitemap [automated]"
            git pull --rebase origin main || true
            git push origin main
          fi
