<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plain iframe — LifeSolveNow</title>
    <style>
      body { margin: 0; font: 14px system-ui, sans-serif; }
      p { margin: 0; padding: 10px 12px; background: #ecfdf5; }
      iframe { display: block; width: 100%; height: calc(100vh - 40px); border: none; }
    </style>
  </head>
  <body>
    <p>
      Embed allow karta hai: <code>https://shop.LifeSolveNow.com</code>
    </p>
    <iframe
      title="LifeSolveNow Shop"
      src="https://shop.LifeSolveNow.com"
      width="100%"
      height="700"
      frameborder="0"
    ></iframe>
  </body>
</html>
